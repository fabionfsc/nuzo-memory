name: Release npm

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Exact SemVer package version to publish.
        required: true
      publish:
        description: Publish to npm. Leave false for a dry run.
        required: true
        type: boolean
        default: false
      artifact_manifest_sha256:
        description: Dry-run artifact-manifest SHA-256 required when publish is true.
        required: false
      reviewed_run_id:
        description: Successful dry-run workflow ID required when publish is true.
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: release-npm-${{ inputs.package_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  npm:
    name: npm trusted publishing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install npm with trusted publishing support
        run: npm install --global "npm@11.5.1"

      - name: Install dependencies
        run: npm ci

      - name: Validate source release state
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: npm run release:check -- "$PACKAGE_VERSION"

      - name: Run validation gates
        run: |
          npm run check
          npm test
          npm run package:npm
          npm run registry:validate
          node tools/smoke-registry-artifact.mjs

      - name: Verify npm publish targets
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node tools/check-npm-publish-targets.mjs "$PACKAGE_VERSION"

      - name: Verify generated npm artifact manifest
        if: ${{ !inputs.publish }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node tools/verify-npm-artifact-manifest.mjs "$PACKAGE_VERSION" - build/npm "$GITHUB_SHA"

      - name: Bind publish to reviewed npm artifact manifest
        if: ${{ inputs.publish }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.artifact_manifest_sha256 }}
        run: node tools/verify-npm-artifact-manifest.mjs "$PACKAGE_VERSION" "$EXPECTED_MANIFEST_SHA256" build/npm "$GITHUB_SHA"

      - name: Verify reviewed dry-run
        id: reviewed-run
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          REVIEWED_RUN_ID: ${{ inputs.reviewed_run_id }}
        run: node tools/verify-reviewed-npm-run.mjs "$PACKAGE_VERSION" "$REVIEWED_RUN_ID" "$GITHUB_SHA"

      - name: Download and verify reviewed npm candidates
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.reviewed-run.outputs.artifact_id }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.artifact_manifest_sha256 }}
        run: |
          rm -rf build/reviewed-npm build/reviewed-npm.zip
          mkdir -p build/reviewed-npm
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > build/reviewed-npm.zip
          unzip -q build/reviewed-npm.zip -d build/reviewed-npm
          node tools/verify-npm-artifact-manifest.mjs "$PACKAGE_VERSION" "$EXPECTED_MANIFEST_SHA256" build/reviewed-npm "$GITHUB_SHA"
          node tools/check-npm-publish-targets.mjs "$PACKAGE_VERSION" build/reviewed-npm/tarballs "$EXPECTED_MANIFEST_SHA256" "$GITHUB_SHA"

      - name: Dry-run npm publish
        if: ${{ !inputs.publish }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node tools/publish-npm-artifacts.mjs "$PACKAGE_VERSION" dry-run

      - name: Retain reviewed npm candidates
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuzo-npm-${{ inputs.package_version }}-${{ github.sha }}
          path: |
            build/npm/artifact-manifest.json
            build/npm/tarballs/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish packages with provenance
        if: ${{ inputs.publish }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.artifact_manifest_sha256 }}
        run: node tools/publish-npm-artifacts.mjs "$PACKAGE_VERSION" publish build/reviewed-npm/tarballs "$EXPECTED_MANIFEST_SHA256" "$GITHUB_SHA"
