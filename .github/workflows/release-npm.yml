name: Release npm

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Exact SemVer package version to publish.
        required: true
      publish:
        description: Publish to npm. Leave false for a dry run.
        required: true
        type: boolean
        default: false
      artifact_manifest_sha256:
        description: Dry-run artifact-manifest SHA-256 required when publish is true.
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-npm-${{ inputs.package_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  npm:
    name: npm trusted publishing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install npm with trusted publishing support
        run: npm install --global "npm@11.5.1"

      - name: Install dependencies
        run: npm ci

      - name: Validate source release state
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: npm run release:check -- "$PACKAGE_VERSION"

      - name: Run validation gates
        run: |
          npm run check
          npm test
          npm run package:npm
          npm run registry:validate
          node tools/smoke-registry-artifact.mjs

      - name: Verify npm publish targets
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node tools/check-npm-publish-targets.mjs "$PACKAGE_VERSION"

      - name: Verify generated npm artifact manifest
        if: ${{ !inputs.publish }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node tools/verify-npm-artifact-manifest.mjs "$PACKAGE_VERSION"

      - name: Bind publish to reviewed npm artifact manifest
        if: ${{ inputs.publish }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.artifact_manifest_sha256 }}
        run: node tools/verify-npm-artifact-manifest.mjs "$PACKAGE_VERSION" "$EXPECTED_MANIFEST_SHA256"

      - name: Dry-run npm publish
        if: ${{ !inputs.publish }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node tools/publish-npm-artifacts.mjs "$PACKAGE_VERSION" dry-run

      - name: Retain reviewed npm candidates
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuzo-npm-${{ inputs.package_version }}-${{ github.sha }}
          path: |
            build/npm/artifact-manifest.json
            build/npm/tarballs/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish packages with provenance
        if: ${{ inputs.publish }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node tools/publish-npm-artifacts.mjs "$PACKAGE_VERSION" publish
